<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

:root{
    --bg1:#4f46e5;
    --bg2:#06b6d4;
    --bg3:#7c3aed;

    --white:#ffffff;
    --light:#f5f7ff;
    --text:#1e293b;

    --primary:#4f46e5;
    --secondary:#06b6d4;
    --danger:#ef4444;
    --success:#22c55e;

    --shadow:0 20px 45px rgba(0,0,0,.18);
    --radius:22px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;

    background:linear-gradient(
        -45deg,
        var(--bg1),
        var(--bg2),
        var(--bg3),
        #2563eb
    );

    background-size:400% 400%;
    animation:backgroundMove 18s ease infinite;
}

body::before{
    content:"";
    position:fixed;
    width:550px;
    height:550px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    top:-180px;
    left:-180px;
    filter:blur(90px);
    animation:blob1 14s infinite alternate;
}

body::after{
    content:"";
    position:fixed;
    width:450px;
    height:450px;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    bottom:-150px;
    right:-150px;
    filter:blur(90px);
    animation:blob2 16s infinite alternate;
}

.container{

    width:540px;

    padding:35px;

    border-radius:var(--radius);

    background:rgba(255,255,255,.20);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.3);

    box-shadow:var(--shadow);

    transition:.4s;

    animation:show .8s ease;
}

.container:hover{

    transform:translateY(-6px);

}

h1{

    text-align:center;

    color:white;

    font-size:38px;

    font-weight:700;

    margin-bottom:25px;

    letter-spacing:3px;

    text-shadow:0 6px 12px rgba(0,0,0,.3);

}

input,
textarea{

    width:100%;

    padding:16px;

    margin:10px 0;

    border:none;

    border-radius:15px;

    background:rgba(255,255,255,.18);

    color:white;

    font-size:15px;

    transition:.35s;

}

input::placeholder,
textarea::placeholder{

    color:#eeeeee;

}

input:hover,
textarea:hover{

    background:rgba(255,255,255,.24);

}

input:focus,
textarea:focus{

    outline:none;

    background:rgba(255,255,255,.30);

    box-shadow:0 0 20px rgba(255,255,255,.35);

    transform:scale(1.02);

}

textarea{

    resize:none;

    height:140px;

}

button{

    padding:13px 22px;

    border:none;

    border-radius:14px;

    cursor:pointer;

    color:white;

    font-size:15px;

    font-weight:600;

    margin-top:10px;

    margin-right:8px;

    background:linear-gradient(
        45deg,
        var(--secondary),
        var(--primary)

    transition:.35s;

}

button:hover{

    transform:translateY(-4px);

    box-shadow:0 12px 20px rgba(0,0,0,.25);

}

button:active{

    transform:scale(.95);

}

#search{

    margin-top:18px;

}

#notesList{

    list-style:none;

    margin-top:25px;

}

#notesList li{

    position:relative;

    overflow:hidden;

    padding:18px;

    margin-bottom:18px;

    border-radius:18px;

    background:rgba(255,255,255,.18);

    color:white;

    transition:.4s;

}

#notesList li:hover{

    transform:translateX(8px);

    box-shadow:0 15px 25px rgba(0,0,0,.18);

}

#notesList li::before{

    content:"";

    position:absolute;

    top:0;

    left:-120%;

    width:60%;

    height:100%;

    background:rgba(255,255,255,.35);

    transform:skewX(-25deg);

}

#notesList li:hover::before{

    animation:shine .8s;

}

#notesList p{

    line-height:1.7;

    margin-bottom:12px;

    word-break:break-word;

}

#notesList button{

    background:linear-gradient(
        45deg,
        #ff416c,
        #ff4b2b
    );

}

#notesList button:hover{

    box-shadow:0 0 18px rgba(255,90,90,.5);

}

    width:10px;

}

::-webkit-scrollbar-thumb{

    background:white;

}

@keyframes show{

    from{

        opacity:0;

    to{

    }

}

@keyframes shine{

    from{

    to{

@keyframes backgroundMove{

}

@keyframes blob2{

    }

    }

<div class="bg-animation">
    <span></span>

<div class="container">

    <div class="logo">
        📝
    </div>

    <h1>Notes App</h1>

    <p class="subtitle">
        Save your ideas forever
    </p>

    <input
        type="text"
        id="noteInput"
        placeholder="Title..."
    >

    <textarea
        id="noteText"
        placeholder="Write something..."
    ></textarea>

    <div class="buttons">

        <button onclick="addNote()">
            ➕ Add
        </button>

        <button onclick="clearNotes()">
            🗑 Clear
        </button>

    </div>

    <input
        type="text"
        id="search"
        placeholder="🔍 Search..."
        onkeyup="searchNotes()"
    >

    <ul id="notesList"></ul>

</div>

<div id="cursor"></div>


</div>

<script>

let notes = JSON.parse(localStorage.getItem("notes")) || [];

showNotes();

function addNote(){

    const title=document.getElementById("noteInput").value.trim();
    const text=document.getElementById("noteText").value.trim();

    if(title==="" && text===""){
        alert("Write a note!");
        return;
    }

    notes.push({
        id:Date.now(),
        text:title+" "+text
    });

    localStorage.setItem("notes",JSON.stringify(notes));

    document.getElementById("noteInput").value="";
    document.getElementById("noteText").value="";

    showNotes();
}

function showNotes(){

    const list=document.getElementById("notesList");

    list.innerHTML="";

    notes.forEach(note=>{

        list.innerHTML+=`
        <li>
            <p>${note.text}</p>
            <button onclick="deleteNote(${note.id})">Delete</button>
        </li>
        `;
    });

}

function deleteNote(id){

    notes=notes.filter(note=>note.id!==id);

    localStorage.setItem("notes",JSON.stringify(notes));

    showNotes();

}

function clearNotes(){

    notes=[];

    localStorage.removeItem("notes");

    showNotes();

}

function searchNotes(){

    const value=document.getElementById("search").value.toLowerCase();

    const list=document.getElementById("notesList");

    list.innerHTML="";

    notes
    .filter(note=>note.text.toLowerCase().includes(value))
    .forEach(note=>{

        list.innerHTML+=`
        <li>
            <p>${note.text}</p>
            <button onclick="deleteNote(${note.id})">Delete</button>
        </li>
        `;

    });

}

</script>
